spring:
  application:
    name: appointment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
    username: ${DB_USERNAME:appointment_user}
    password: ${DB_PASSWORD:appointment_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      platform: postgresql

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:file:../keys/public.pem}

outbox:
  relay:
    fixed-delay-ms: 1000
    batch-size: 100
    max-block-ms: 15000
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
  pruning:
    cron: "0 0 3 * * *"
    retention-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health, beans, mappings

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

server:
  port: 8081
