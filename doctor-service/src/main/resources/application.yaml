spring:
  application:
    name: doctor-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/doctor_db}
    username: ${DB_USERNAME:doctor_user}
    password: ${DB_PASSWORD:doctor_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:file:../keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY_PATH:file:../keys/private.pem}
    expiration: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, beans, mappings

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

server:
  port: 8084
