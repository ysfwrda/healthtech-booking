spring:
  application:
    name: api-gateway

app:
  gateway:
    appointment-service-uri: ${APPOINTMENT_SERVICE_URI:http://localhost:8081}
    patient-service-uri: ${PATIENT_SERVICE_URI:http://localhost:8083}
    doctor-service-uri: ${DOCTOR_SERVICE_URI:http://localhost:8084}
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:file:../keys/public.pem}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Aggregated Swagger UI: the gateway has no API of its own, so its own /v3/api-docs is off and
# each service's spec is proxied through /docs/<service>/v3/api-docs (see GatewayConfig).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    urls:
      - name: Appointment Service
        url: /docs/appointment/v3/api-docs
      - name: Patient Service
        url: /docs/patient/v3/api-docs
      - name: Doctor Service
        url: /docs/doctor/v3/api-docs

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

server:
  port: 8080
