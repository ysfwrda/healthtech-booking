name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            test_args: ""
          - service: appointment-service
            test_args: ""
          - service: doctor-service
            test_args: "-Dtest=!DoctorServiceApplicationTests"
          - service: notification-service
            test_args: ""
          - service: patient-service
            test_args: "-Dtest=!PatientServiceApplicationTests"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Generate JWT signing keys
        if: matrix.service == 'patient-service'
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B test ${{ matrix.test_args }}
